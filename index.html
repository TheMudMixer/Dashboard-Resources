<!DOCTYPE html>
<html>
<head>
<meta charset="UTF-8">
<title>Mud Mixer Dashboard Header</title>
<style>
  :root {
    --bg: #ffffff;
    --accent: #F2A900;
    --text-primary: #1a1a1a;
    --text-secondary: #6b6b6b;
  }
  html, body {
    margin: 0;
    padding: 0;
    background: var(--bg);
    height: 100%;
    overflow: hidden;
  }
  body {
    font-family: Arial, Helvetica, sans-serif;
    display: flex;
    align-items: flex-start;
    height: 100%;
    box-sizing: border-box;
  }
  .header-bar {
    display: flex;
    align-items: center;
    width: 100%;
    box-sizing: border-box;
    padding: 16px 24px;
    gap: 20px;
    border-bottom: 4px solid var(--accent);
  }
  .badge {
    border: 2px solid var(--accent);
    color: var(--text-primary);
    text-align: center;
    font-weight: bold;
    line-height: 1.2;
    padding: 8px 16px;
    border-radius: 4px;
    white-space: nowrap;
    flex-shrink: 0;
  }
  .badge .qtr {
    font-size: 20px;
    color: var(--accent);
  }
  .badge .yr {
    font-size: 16px;
  }
  .logo {
    height: 48px;
    flex-shrink: 0;
  }
  .divider {
    width: 1px;
    height: 40px;
    background: rgba(0,0,0,0.15);
    flex-shrink: 0;
  }
  .textblock {
    display: flex;
    flex-direction: column;
  }
  .company {
    color: var(--text-primary);
    font-size: 20px;
    font-weight: 600;
    letter-spacing: 0.3px;
  }
  .date {
    color: var(--text-secondary);
    font-size: 13px;
    margin-top: 2px;
  }
</style>
</head>

<script>
  function updateHeader() {
    var now = new Date();
    var month = now.getMonth();
    var year = now.getFullYear();

    var quarter;
    if (month <= 2) quarter = 1;
    else if (month <= 5) quarter = 2;
    else if (month <= 8) quarter = 3;
    else quarter = 4;

    document.getElementById('qtrLabel').textContent = 'Q' + quarter;
    document.getElementById('yrLabel').textContent = year;

    var months = ['January','February','March','April','May','June',
                  'July','August','September','October','November','December'];
    var dateStr = months[month] + ' ' + now.getDate() + ', ' + year;
    document.getElementById('dateLabel').textContent = dateStr;
  }

  updateHeader();
  setInterval(updateHeader, 60 * 1000);
</script>
